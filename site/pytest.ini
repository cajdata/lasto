# The site's own tests. Run from the repo root:
#     python -m pytest -c site/pytest.ini site/tests
# This config is separate on purpose: the app's pytest settings in pyproject.toml load the
# simulator plugin and enforce 100% branch coverage on lasto.safety, and none of that
# applies to (or should be loosened for) the website.
[pytest]
testpaths = tests
addopts = -ra --strict-markers -p no:cacheprovider
