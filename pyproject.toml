[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "lasto"
dynamic = ["version"]
description = "Passive, read-only CAN bus logger for Toyota and Lexus trucks."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Chris Johnson" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://lasto.dev"
Source = "https://github.com/cajdata/lasto"

[project.scripts]
lasto = "lasto.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.1",
]

[tool.hatch.version]
path = "src/lasto/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lasto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# The safety core must stay at 100% branch coverage; the test command enforces it.
addopts = [
    "-ra",
    "--strict-markers",
    # Hardware firewall and simulator violation check; loaded before any test module.
    "-p", "lasto.sim.pytest_plugin",
    "-p", "pytester",
    "--cov=lasto.safety",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
