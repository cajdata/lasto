[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "lasto"
dynamic = ["version"]
description = "A read-only data logger for a 2006 Lexus GX470."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Chris Johnson" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Each dependency arrives in the phase that first needs it, pinned exactly (docs/architecture.md §10).
dependencies = [
    "zstandard==0.25.0",  # Phase 2: raw capture segments, one checksummed zstd frame per second
]

[project.urls]
Homepage = "https://lasto.dev"
Source = "https://github.com/cajdata/lasto"

[project.scripts]
lasto = "lasto.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.1",
]
# The lasto.dev website build (site/) pins its own dependencies, with hashes, in
# site/requirements.txt. None of them are lasto dependencies.

[tool.hatch.version]
path = "src/lasto/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lasto"]

[tool.hatch.build.targets.sdist]
# The website source and its fonts don't belong in the lasto package.
exclude = ["/site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# Coverage is measured on all of lasto. tests/conftest.py fails the run below each package's gate
# (tests/coverage_gates.py): 100% branch on the safety core, 90% on capture and storage.
addopts = [
    "-ra",
    "--strict-markers",
    # Hardware firewall and simulator violation check; loaded before any test module.
    "-p", "lasto.sim.pytest_plugin",
    "-p", "pytester",
    # pytest's logging plugin opens the null device for writing, and guard v2 lets a test run write only in its
    # own folders. lasto logs nothing through logging, so the plugin has nothing to capture.
    "-p", "no:logging",
    "--cov=lasto",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
